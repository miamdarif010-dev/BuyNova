name: Generate Debug Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print SHA-1 (copy this into Firebase Console)
        run: |
          echo "===== SHA-1 START ====="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"
          echo "===== SHA-1 END ====="

      - name: Print base64 keystore (copy this into GitHub Secret DEBUG_KEYSTORE_BASE64)
        run: |
          echo "===== BASE64 START ====="
          base64 -w 0 debug.keystore
          echo ""
          echo "===== BASE64 END ====="
